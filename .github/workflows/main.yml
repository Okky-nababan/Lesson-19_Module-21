name: CI - API & UI Web Automation Test

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  automation-test:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Run automated tests (API + UI Web)
        run: gradle test --no-daemon
        env:
          CI: "true"

      - name: Upload Cucumber HTML/JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-ui-report
          path: build/reports/cucumber/
          retention-days: 14

      - name: Upload Gradle/JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-junit-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 14
